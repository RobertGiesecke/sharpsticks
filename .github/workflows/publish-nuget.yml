name: Publish existing release to NuGet

on:
  push:
    tags: ['publish-nuget/*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      TRIGGER_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Log in to nuget.org with trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER || 'RobertGiesecke' }}

      - name: Download and publish existing release packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if (!$env:NUGET_API_KEY) { throw 'NuGet trusted publishing did not return a temporary API key' }
          $version = $env:REQUESTED_TAG
          if (!$version) { $version = $env:TRIGGER_TAG -replace '^publish-nuget/', '' }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid release version' }
          gh release download $version --pattern '*.nupkg' --dir artifacts/nuget
          if ($LASTEXITCODE -ne 0) { throw 'Could not download release packages' }
          ./tools/Publish-NuGet.ps1 -Version $version -PackageDirectory artifacts/nuget
