name: Release packages

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select SDKs
        id: sdk
        run: |
          'versions<<EOF' >> $env:GITHUB_OUTPUT
          '10.0.x' >> $env:GITHUB_OUTPUT
          if ((Get-Content Directory.Build.props -Raw) -match 'net11\.0') {
            '11.0.x' >> $env:GITHUB_OUTPUT
          }
          'EOF' >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.sdk.outputs.versions }}

      - name: Build, test and pack
        run: ./tools/Build-Release.ps1 -Version $env:RELEASE_TAG

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.RELEASE_TAG }}
          path: artifacts/release/*.nupkg
          if-no-files-found: error

      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:RELEASE_TAG --json tagName
          if ($LASTEXITCODE -ne 0) {
            $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--title', $env:RELEASE_TAG, '--generate-notes')
            if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
            gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          $packages = @(Get-ChildItem artifacts/release/*.nupkg | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @packages --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release packages' }
